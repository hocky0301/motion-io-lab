<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <rect width="900" height="600" fill="#ffffff"/>
  <text x="20" y="28" font-size="16" font-weight="bold" fill="#111">Logical wiring: the role of each terminal (not a photographed layout)</text>
  <text x="20" y="50" fill="#8a1c1c">Not verified on hardware. Check every connection against the real boards before applying power.</text>

  <rect x="20" y="110" width="100" height="70" rx="6" fill="#eef3f8" stroke="#334455"/>
  <text x="70" y="140" text-anchor="middle" fill="#111">Mac</text>
  <text x="70" y="160" text-anchor="middle" fill="#555">USB host</text>
  <line x1="120" y1="145" x2="260" y2="145" stroke="#334455" stroke-width="2"/>
  <text x="190" y="136" text-anchor="middle" fill="#334455">USB-C</text>
  <text x="190" y="165" text-anchor="middle" fill="#555">logic power + serial</text>

  <rect x="260" y="90" width="190" height="200" rx="6" fill="#eef3f8" stroke="#334455"/>
  <text x="355" y="112" text-anchor="middle" font-weight="bold" fill="#111">XIAO ESP32S3</text>
  <text x="355" y="130" text-anchor="middle" fill="#555">regular board, not Sense</text>
  <text x="272" y="170" fill="#111">3V3</text>
  <text x="272" y="195" fill="#111">GND</text>
  <text x="272" y="220" fill="#111">D4 = GPIO5  (SDA)</text>
  <text x="272" y="245" fill="#111">D5 = GPIO6  (SCL)</text>
  <text x="272" y="270" fill="#111">D0 = GPIO1  (OE)</text>

  <rect x="610" y="90" width="170" height="200" rx="6" fill="#f6f1e6" stroke="#554433"/>
  <text x="695" y="112" text-anchor="middle" font-weight="bold" fill="#111">PCA9685 board</text>
  <text x="622" y="170" fill="#111">VCC (logic)</text>
  <text x="622" y="195" fill="#111">GND</text>
  <text x="622" y="220" fill="#111">SDA</text>
  <text x="622" y="245" fill="#111">SCL</text>
  <text x="622" y="270" fill="#111">OE</text>
  <text x="770" y="170" text-anchor="end" fill="#111">CH0</text>

  <line x1="450" y1="166" x2="610" y2="166" stroke="#22aa77" stroke-width="2"/>
  <line x1="450" y1="191" x2="610" y2="191" stroke="#222222" stroke-width="2"/>
  <line x1="450" y1="216" x2="610" y2="216" stroke="#3377cc" stroke-width="2"/>
  <line x1="450" y1="241" x2="610" y2="241" stroke="#cc7733" stroke-width="2"/>
  <line x1="450" y1="266" x2="610" y2="266" stroke="#aa33aa" stroke-width="2"/>
  <text x="530" y="158" text-anchor="middle" fill="#22aa77">3.3 V logic only</text>

  <line x1="530" y1="266" x2="530" y2="292" stroke="#aa33aa" stroke-width="2"/>
  <rect x="518" y="292" width="24" height="40" fill="#ffffff" stroke="#aa33aa"/>
  <text x="530" y="317" text-anchor="middle" fill="#aa33aa">R</text>
  <line x1="530" y1="332" x2="530" y2="346" stroke="#aa33aa" stroke-width="2"/>
  <text x="530" y="362" text-anchor="middle" fill="#aa33aa">to 3V3</text>
  <text x="505" y="310" text-anchor="end" fill="#aa33aa">OE pull-up (value: not decided yet)</text>
  <text x="505" y="328" text-anchor="end" fill="#aa33aa">keeps OE high = outputs off during MCU reset</text>

  <rect x="810" y="130" width="80" height="80" rx="6" fill="#eef7ee" stroke="#336633"/>
  <text x="850" y="162" text-anchor="middle" fill="#111">MG90S</text>
  <text x="850" y="180" text-anchor="middle" fill="#555">servo</text>
  <text x="850" y="198" text-anchor="middle" fill="#555">+ marker</text>
  <line x1="780" y1="166" x2="810" y2="166" stroke="#cc7733" stroke-width="2"/>

  <rect x="90" y="430" width="170" height="50" rx="6" fill="#fdecea" stroke="#aa3333"/>
  <text x="175" y="452" text-anchor="middle" fill="#111">External 5 V supply</text>
  <text x="175" y="470" text-anchor="middle" fill="#555">adapter set to 5 V</text>
  <rect x="340" y="430" width="170" height="50" rx="6" fill="#fdecea" stroke="#aa3333"/>
  <text x="425" y="452" text-anchor="middle" fill="#111">e-stop (2NC contact)</text>
  <text x="425" y="470" text-anchor="middle" fill="#aa3333">contact rating: to check against the data sheet</text>
  <line x1="260" y1="455" x2="340" y2="455" stroke="#aa3333" stroke-width="3"/>
  <path d="M510 455 H700 V292" fill="none" stroke="#aa3333" stroke-width="3"/>
  <text x="712" y="380" fill="#aa3333">V+ (servo power terminal)</text>
  <text x="712" y="398" fill="#aa3333">only via the e-stop</text>
  <text x="590" y="502" text-anchor="middle" fill="#aa3333">Never power the servo from USB, 3V3 or a signal pin.</text>

  <text x="20" y="550" fill="#555">Common ground: logic GND and the 5 V supply GND meet at one point; keep the servo current off the thin MCU ground path.</text>
  <text x="20" y="570" fill="#555">Software stop (OE high, STOP, DISARM) does not replace the e-stop. Removing power also removes holding torque.</text>
</svg>
